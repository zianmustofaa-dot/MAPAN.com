# Nginx untuk MAPAN Web (Railway)
# Frontend statis dari dist/ + reverse proxy /api ke service API internal.
# Service API harus bernama "api" (lihat panduan deploy) agar hostname ini cocok.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: proxied ke service "api" lewat jaringan internal Railway (gratis bandwidth)
    location /api/ {
        proxy_pass http://api.railway.internal:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
    }

    # Aset build: cache keras
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (aplikasi ini pakai hash routing)
    location / {
        try_files $uri /index.html;
    }
}
